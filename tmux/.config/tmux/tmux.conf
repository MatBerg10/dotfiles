# Set true color 
set-option -sa terminal-overrides ",xterm*:Tc"

# Set tmux bar to top
set -g status-position top

# Set mouse support
set -g mouse on

#Change <prefix>
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

#Set window numbering to start at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g  renumber-windows on

#Alt + Shift + h/l to cycle windows
bind -n M-L next-window
bind -n M-H previous-window

bind '"' split-window -h -c "#{pane_current_path}"
bind '%' split-window -v -c "#{pane_current_path}"

# Set tmux-yank binds
set-window-option -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# Edit values if you use custom resize_count variables
bind-key -n M-h if-shell "$is_vim" "send-keys M-h"  "resize-pane -L 5"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j"  "resize-pane -D 5"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k"  "resize-pane -U 5"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l"  "resize-pane -R 5"

bind-key -T copy-mode-vi M-h resize-pane -L 10
bind-key -T copy-mode-vi M-j resize-pane -D 5
bind-key -T copy-mode-vi M-k resize-pane -U 5
bind-key -T copy-mode-vi M-l resize-pane -R 10

bind '=' run-shell "
    if [ \"$(tmux display-message -p '#{window_layout}')\" = 'tiled' ]; then
        tmux select-layout even-horizontal;
    elif [ \"$(tmux display-message -p '#{window_layout}')\" = 'even-horizontal' ]; then
        tmux select-layout even-vertical;
    else
        tmux select-layout tiled;
    fi"


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'RyanMillerC/better-vim-tmux-resizer'

run '~/.tmux/plugins/tpm/tpm'
run '~/clone/path/yank.tmux'
