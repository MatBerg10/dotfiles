[character]
success_symbol = '[❯](bold dimmed green)'
error_symbol = '[❯](bold red)'

[line_break]
disabled = true

[cmd_duration]
disabled = true

[username]
disabled = false
show_always = true
style_root = "purple bold"
style_user = " blue bold"
format = '[$user@]($style)'

[hostname]
disabled = false
ssh_only = false
style = " blue bold"
format = '[$ssh_symbol$hostname: ]($style)'

[directory]
style = "bold green"

[git_branch]
style = "bold red"
